  <!-- Frecce di conciliazione tra i due documenti -->
  <g fill="none" stroke="#1F5C8B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <line x1="104" y1="104" x2="136" y2="104"/>
